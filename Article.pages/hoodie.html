<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoodie</title>
    <link rel="stylesheet" href="../mainstyle.css">
    <link rel="stylesheet" href="../homepage.css">
    <link rel="stylesheet" href="../article.page.css">
</head>
<body>
    <div id="topbar">
        <a id="logo" href="../index.html">
            <img src="../img/logo.png" alt="EGON Logo" height="100%" width="auto"/>
        </a>
    </div>

    <div id="content">
        <div class="article-image">
            <img src="../img/products/Hood/HoodBP b.png" id="hoodiebp" alt="Merch Hoodie"/>
            <div class="button-container">
                <button id="b" class="color"
                    onclick='event.preventDefault(); document.getElementById("hoodiebp").src="../img/products/Hood/HoodBP b.png"'>
                </button>

                <button id="lb" class="color"
                    onclick='event.preventDefault(); document.getElementById("hoodiebp").src="../img/products/Hood/HoodBP lb.png"'>
                </button>
                
                <button id="r" class="color"
                    onclick='event.preventDefault(); document.getElementById("hoodiebp").src="../img/products/Hood/HoodBP r.png"'>
                </button>
            </div>
        </div>
        <div class="article-info">
            <h1>Hoodie</h1>
            <h2>Backprint</h2>
            <p>36€</p>

            <div class="article-text">
                <p>Unsere klassische Hoodie mit Rückendruck – bequem, warm und stilvoll. Perfekt für kühle Tage.</p>
            </div>
        </div>
    </div>
</body>
</html>
